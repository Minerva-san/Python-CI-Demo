name: Python CI/CD Pipeline

on:
  push:
    branches: [ "main" ]

jobs:
  # --- 1. THE CI JOB (Same as before) ---
  run-tests:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Pytest
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    - name: Run Pytest
      run: pytest

  # --- 2. THE CD JOB (The New Deployment Step) ---
  deploy-artifact:
    runs-on: ubuntu-latest
    # CRITICAL: This ensures deployment ONLY runs if the tests passed successfully!
    needs: run-tests
    
    permissions:
      contents: write # Gives GitHub permission to create a release

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    # Simulate creating a production zip file of your app
    - name: Package Application
      run: |
        zip -r python-app.zip calculator.py

    # Automatically create a "Release" on GitHub and upload the zip file
    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: v1.0.${{ github.run_number }}
        name: Release v1.0.${{ github.run_number }}
        files: python-app.zip
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}