name: Python Automated Testing

# Trigger this pipeline every time someone pushes code to the 'main' branch
on:
  push:
    branches: [ "main" ]

jobs:
  run-tests:
    # Use a fresh, automated Ubuntu Linux cloud computer
    runs-on: ubuntu-latest

    steps:
    # 1. Download your repository files onto the cloud computer
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Set up Python on the cloud computer
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    # 3. Install pytest on the cloud computer
    - name: Install Pytest
      run: |
        python -m pip install --upgrade pip
        pip install pytest

    # 4. Execute the tests
    - name: Run Pytest
      run: pytest